name: Release

# Every push to main ships a new installable release:
# version starts at 0.0.1 and the patch number increases by 1 on each push.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute next version (v0.0.1, then +0.0.1 per push)
        id: version
        run: |
          LAST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -z "$LAST_TAG" ]; then
            VERSION="0.0.1"
          else
            VERSION="${LAST_TAG#v}"
            MAJOR="${VERSION%%.*}"
            REST="${VERSION#*.}"
            MINOR="${REST%%.*}"
            PATCH="${REST#*.}"
            VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          fi
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$((MAJOR * 10000 + MINOR * 100 + PATCH))" >> "$GITHUB_OUTPUT"
          echo "Released version: v$VERSION (code $((MAJOR * 10000 + MINOR * 100 + PATCH)))"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run backend tests
        run: |
          python -m pip install -r requirements-dev.txt
          pytest -q

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Build Android app
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.version }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          npm ci
          # Optional: set repo variable APP_API_URL to the deployed backend URL
          # and it is baked into the app bundle (Settings > Secrets and variables > Actions).
          if [ -n "${{ vars.APP_API_URL }}" ]; then
            printf "window.BILLOMADFX_API_URL = '%s';\n" "${{ vars.APP_API_URL }}" > web_app/config.js
          fi
          npx cap sync android
          chmod +x android/gradlew
          (cd android && ./gradlew assembleRelease --no-daemon)

      - name: Collect release artifacts
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cp android/app/build/outputs/apk/release/app-release.apk "BILLOMADFX-v${VERSION}.apk"
          zip -qr "BILLOMADFX-PWA-v${VERSION}.zip" web_app
          ls -la BILLOMADFX*

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "## Install BILLOMADFX v${VERSION}"
            echo
            echo "### Android"
            echo "1. Download \`BILLOMADFX-v${VERSION}.apk\` below."
            echo "2. Open it and allow *Install unknown apps* for your browser if asked."
            echo "3. Updates install directly over older versions."
            echo
            echo "### Windows / macOS / Linux / iOS"
            echo "- Deploy the backend (see README), open its URL, and use the in-app **Install app** button"
            echo "  (Chrome/Edge) or Safari *Share → Add to Home Screen* (iOS)."
            echo "- \`BILLOMADFX-PWA-v${VERSION}.zip\` contains the installable web app for self-hosting."
            echo
            echo "### Backend version"
            echo "- API \`/api/v1/meta\` reports this version."
            echo
            echo "## What changed"
            echo
            PREV_TAG=$(git tag -l 'v*' --sort=-v:refname | sed -n '2p')
            if [ -n "$PREV_TAG" ]; then
              git log --pretty=format:'- %s' "$PREV_TAG".."$GITHUB_SHA"
            else
              git log --pretty=format:'- %s' "$GITHUB_SHA"
            fi
          } > release-notes.md
          gh release create "v${VERSION}" \
            "BILLOMADFX-v${VERSION}.apk" "BILLOMADFX-PWA-v${VERSION}.zip" \
            --target "$GITHUB_SHA" \
            --title "BILLOMADFX v${VERSION}" \
            --notes-file release-notes.md
