<div class="auth-overlay" id="authOverlay" role="dialog" aria-modal="true" aria-labelledby="authTitle">
  <div class="auth-card">
    <div class="auth-brand"><div class="brand-mark">B</div><div><strong>BILLOMAD<span>FX</span></strong><small>TRADE • ANALYSE • GROW</small></div></div>
    <div class="auth-tabs"><button class="active" data-auth-tab="login">Sign in</button><button data-auth-tab="register">Create account</button></div>
    <form id="loginForm" class="auth-form active">
      <h1 id="authTitle">Welcome back</h1><p>Access your demo trading workspace.</p>
      <label>Email address<input id="loginEmail" type="email" autocomplete="email" required></label>
      <label>Password<input id="loginPassword" type="password" autocomplete="current-password" required></label>
      <button class="gold-button" id="loginSubmit" type="submit">Sign in securely</button>
    </form>
    <form id="registerForm" class="auth-form">
      <h1>Create account</h1><p>Start in a safe demo-only environment.</p>
      <label>Display name<input id="registerName" type="text" maxlength="80" autocomplete="name" required></label>
      <label>Email address<input id="registerEmail" type="email" autocomplete="email" required></label>
      <label>Password <small>Minimum 12 characters</small><input id="registerPassword" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label>
      <button class="gold-button" id="registerSubmit" type="submit">Create account</button>
    </form>
    <div class="auth-safety">This prototype cannot submit broker orders.</div>
  </div>
</div>
